<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Meine Todos</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Todos">
<meta name="theme-color" content="#f4f1ea" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#1b1a18" media="(prefers-color-scheme: dark)">
<script>
  (function () {
    var th = null;
    try { th = localStorage.getItem("todos-theme"); } catch (e) {}
    if (th !== "light" && th !== "dark") th = matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
    document.documentElement.dataset.theme = th;
  })();
</script>
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" type="image/png" href="icon-192.png">
<style>
  :root {
    --bg: #f4f1ea;
    --card: #fffdf8;
    --text: #2b2a27;
    --muted: #8a867c;
    --line: #e4dfd3;
    --accent: #d9622b;
    --accent-soft: #fbe5d9;
    --done: #6f9a6a;
    --late: #c8372d;
    --late-soft: #f8dcd8;
    --today: #b7791f;
    --today-soft: #f7ead2;
    --chip: #efebe2;
  }
  :root { color-scheme: light; }
  /* Dunkles Design */
  :root[data-theme="dark"] {
    color-scheme: dark;
    --bg: #1b1a18;
    --card: #252421;
    --text: #ece8df;
    --muted: #8f8a80;
    --line: #36342f;
    --accent: #f07a42;
    --accent-soft: #3a2a20;
    --done: #8fbf89;
    --late: #f0786d;
    --late-soft: #3d2422;
    --today: #e5b45a;
    --today-soft: #3a3020;
    --chip: #302e2a;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    background: var(--bg);
    color: var(--text);
    font-family: ui-rounded, "SF Pro Rounded", system-ui, -apple-system, "Segoe UI", sans-serif;
    display: flex;
    justify-content: center;
    padding: max(48px, calc(env(safe-area-inset-top) + 20px))
             max(16px, env(safe-area-inset-right))
             max(32px, calc(env(safe-area-inset-bottom) + 16px))
             max(16px, env(safe-area-inset-left));
    -webkit-tap-highlight-color: transparent;
  }
  main { width: 100%; max-width: 600px; }
  h1 {
    font-size: 2.2rem;
    margin: 0 0 4px;
    letter-spacing: -0.02em;
  }
  .sub { color: var(--muted); margin: 0 0 28px; font-size: 0.95rem; }
  .head { display: flex; align-items: flex-start; justify-content: space-between; gap: 12px; }
  .theme {
    display: flex;
    flex-shrink: 0;
    margin-top: 6px;
    padding: 3px;
    gap: 2px;
    border-radius: 999px;
    background: var(--chip);
  }
  .theme button {
    display: grid;
    place-items: center;
    width: 34px; height: 30px;
    border: none;
    border-radius: 999px;
    background: transparent;
    color: var(--muted);
    cursor: pointer;
    padding: 0;
  }
  .theme button svg { width: 17px; height: 17px; }
  /* Theme-Wechsel: neues Design "läuft" von oben nach unten über die Seite */
  ::view-transition-old(root),
  ::view-transition-new(root) { animation: none; mix-blend-mode: normal; }
  ::view-transition-new(root) { z-index: 2; }
  .theme button.active { background: var(--card); color: var(--accent); box-shadow: 0 1px 3px rgba(0,0,0,.12); }
  form {
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
    margin-bottom: 20px;
  }
  input[type="text"], form input[type="date"] {
    font: inherit;
    font-size: 1rem;
    padding: 14px 16px;
    border: 2px solid var(--line);
    border-radius: 12px;
    background: var(--card);
    color: var(--text);
    outline: none;
    transition: border-color .15s;
  }
  input[type="text"] { flex: 1 1 240px; min-width: 0; }
  form input[type="date"] { flex: 0 0 auto; }
  form input[type="date"]:invalid, form input[type="date"].empty { color: var(--muted); }
  input[type="text"]:focus, form input[type="date"]:focus { border-color: var(--accent); }
  button.add {
    font: inherit;
    font-weight: 600;
    padding: 14px 22px;
    border: none;
    border-radius: 12px;
    background: var(--accent);
    color: #fff;
    cursor: pointer;
  }
  button.add:hover { filter: brightness(1.08); }
  .filters {
    display: flex;
    flex-wrap: wrap;
    gap: 6px;
    margin-bottom: 12px;
    align-items: center;
  }
  .filters button {
    font: inherit;
    font-size: 0.85rem;
    padding: 6px 12px;
    border: none;
    border-radius: 999px;
    background: transparent;
    color: var(--muted);
    cursor: pointer;
  }
  .filters button.active { background: var(--accent-soft); color: var(--accent); font-weight: 600; }
  .filters .spacer { flex: 1; }
  .filters .clear:hover { color: var(--accent); }
  ul {
    list-style: none;
    margin: 0;
    padding: 0;
    background: var(--card);
    border: 1px solid var(--line);
    border-radius: 16px;
    overflow: hidden;
  }
  li {
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 14px 16px;
    border-bottom: 1px solid var(--line);
  }
  li:last-child { border-bottom: none; }
  li.overdue:not(.done) { box-shadow: inset 3px 0 0 var(--late); }
  .check {
    appearance: none;
    width: 22px; height: 22px;
    border: 2px solid var(--line);
    border-radius: 7px;
    cursor: pointer;
    flex-shrink: 0;
    display: grid;
    place-content: center;
    transition: all .15s;
    margin: 0;
  }
  .check:hover { border-color: var(--done); }
  .check:checked { background: var(--done); border-color: var(--done); }
  .check:checked::after {
    content: "";
    width: 6px; height: 11px;
    border: solid #fff;
    border-width: 0 2.5px 2.5px 0;
    transform: rotate(45deg) translate(-1px, -1px);
  }
  .text { flex: 1; word-break: break-word; line-height: 1.4; }
  li.done .text { text-decoration: line-through; color: var(--muted); }

  /* Deadline-Chip */
  .due {
    position: relative;
    flex-shrink: 0;
    font-size: 0.8rem;
    padding: 5px 10px;
    border-radius: 999px;
    background: var(--chip);
    color: var(--muted);
    cursor: pointer;
    white-space: nowrap;
    user-select: none;
  }
  .due.none { background: transparent; border: 1px dashed var(--line); padding: 4px 9px; }
  .due.none:hover { color: var(--accent); border-color: var(--accent); }
  .due.today { background: var(--today-soft); color: var(--today); font-weight: 600; }
  .due.late { background: var(--late-soft); color: var(--late); font-weight: 600; }
  li.done .due { background: transparent; color: var(--muted); font-weight: normal; }
  .due input {
    position: absolute;
    inset: 0;
    opacity: 0;
    width: 100%;
    height: 100%;
    cursor: pointer;
    border: none;
    padding: 0;
  }
  .due .x {
    margin-left: 6px;
    opacity: 0.6;
    position: relative;
    z-index: 1;
  }
  .due .x:hover { opacity: 1; }

  .del {
    border: none;
    background: transparent;
    color: var(--muted);
    font-size: 1.3rem;
    line-height: 1;
    width: 32px; height: 32px;
    border-radius: 8px;
    cursor: pointer;
    opacity: 0.5;
    transition: all .15s;
    flex-shrink: 0;
  }
  li:hover .del { opacity: 1; }
  .del:hover { background: var(--accent-soft); color: var(--accent); }
  .empty {
    text-align: center;
    color: var(--muted);
    padding: 36px 16px;
    background: var(--card);
    border: 1px dashed var(--line);
    border-radius: 16px;
  }
  .backup {
    display: flex;
    justify-content: center;
    gap: 6px;
    margin-top: 28px;
  }
  .backup button {
    font: inherit;
    font-size: 0.8rem;
    padding: 6px 12px;
    border: 1px solid var(--line);
    border-radius: 999px;
    background: transparent;
    color: var(--muted);
    cursor: pointer;
  }
  .backup button:hover { color: var(--accent); border-color: var(--accent); }
  @media (hover: none) {
    .del { opacity: 1; }
  }
  /* iPhone: leeres Datumsfeld zeigt sonst gar nichts an */
  @supports (-webkit-touch-callout: none) {
    form input[type="date"] { -webkit-appearance: none; appearance: none; min-height: 54px; text-align: left; }
    form input[type="date"].empty::before { content: "📅 Deadline (optional)"; color: var(--muted); }
    form input[type="date"]::-webkit-date-and-time-value { text-align: left; }
  }
  @media (max-width: 480px) {
    form input[type="date"] { flex: 1 1 auto; min-width: 0; }
    button.add { flex: 0 0 auto; }
    li {
      display: grid;
      grid-template-columns: 22px 1fr 32px;
      column-gap: 12px;
      row-gap: 8px;
    }
    .check { grid-column: 1; grid-row: 1; }
    .text { grid-column: 2; grid-row: 1; }
    .del { grid-column: 3; grid-row: 1; }
    .due { grid-column: 2; grid-row: 2; justify-self: start; }
  }
</style>
</head>
<body>
<main>
  <div class="head">
    <div>
      <h1>Meine Todos</h1>
      <p class="sub" id="count"></p>
    </div>
    <div class="theme" role="radiogroup" aria-label="Darstellung">
      <button type="button" data-theme-btn="light" title="Hell" aria-label="Hell">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="4.2"/><path d="M12 2.5v2.2M12 19.3v2.2M2.5 12h2.2M19.3 12h2.2M5.3 5.3l1.6 1.6M17.1 17.1l1.6 1.6M5.3 18.7l1.6-1.6M17.1 6.9l1.6-1.6"/></svg>
      </button>
      <button type="button" data-theme-btn="dark" title="Dunkel" aria-label="Dunkel">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><path d="M20 14.5A8.5 8.5 0 0 1 9.5 4a8.5 8.5 0 1 0 10.5 10.5z"/></svg>
      </button>
    </div>
  </div>

  <form id="form">
    <input type="text" id="input" placeholder="Was steht an?" autocomplete="off" autofocus>
    <input type="date" id="date" title="Deadline (optional)" class="empty">
    <button class="add" type="submit">Hinzufügen</button>
  </form>

  <div class="filters">
    <button data-filter="all" class="active">Alle</button>
    <button data-filter="open">Offen</button>
    <button data-filter="done">Erledigt</button>
    <button data-filter="late">Überfällig</button>
    <span class="spacer"></span>
    <button id="sort">Nach Deadline sortieren</button>
    <button class="clear" id="clear">Erledigte löschen</button>
  </div>

  <ul id="list"></ul>
  <div class="empty" id="empty" hidden></div>

  <div class="backup">
    <button id="export" type="button">Backup speichern</button>
    <button id="import" type="button">Backup laden</button>
    <input type="file" id="importFile" accept="application/json,.json" hidden>
  </div>
</main>

<script>
  const KEY = "todos-v1";
  const SORT_KEY = "todos-sort";
  let todos = [];
  let filter = "all";
  let sortByDue = false;

  try { todos = JSON.parse(localStorage.getItem(KEY)) || []; } catch (e) { todos = []; }
  try { sortByDue = localStorage.getItem(SORT_KEY) === "1"; } catch (e) {}

  const save = () => { try { localStorage.setItem(KEY, JSON.stringify(todos)); } catch (e) {} };

  const list = document.getElementById("list");
  const empty = document.getElementById("empty");
  const count = document.getElementById("count");
  const input = document.getElementById("input");
  const dateInput = document.getElementById("date");
  const sortBtn = document.getElementById("sort");

  // --- Datum-Helfer ---
  function todayStr() {
    const d = new Date();
    return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, "0")}-${String(d.getDate()).padStart(2, "0")}`;
  }
  function dayDiff(due) {
    const [y, m, d] = due.split("-").map(Number);
    const a = new Date(y, m - 1, d);
    const t = new Date(); t.setHours(0, 0, 0, 0);
    return Math.round((a - t) / 86400000);
  }
  function formatDue(due) {
    const diff = dayDiff(due);
    const [y, m, d] = due.split("-").map(Number);
    const date = new Date(y, m - 1, d);
    const sameYear = y === new Date().getFullYear();
    const short = date.toLocaleDateString("de-DE", { day: "numeric", month: "short", ...(sameYear ? {} : { year: "numeric" }) });
    if (diff === 0) return "Heute";
    if (diff === 1) return "Morgen";
    if (diff === -1) return "Gestern fällig";
    if (diff < -1) return `Überfällig · ${short}`;
    if (diff < 7) return date.toLocaleDateString("de-DE", { weekday: "long" });
    return date.toLocaleDateString("de-DE", { weekday: "short", ...{ day: "numeric", month: "short" }, ...(sameYear ? {} : { year: "numeric" }) });
  }
  const isLate = t => t.due && !t.done && dayDiff(t.due) < 0;

  function openPicker(inp) {
    try { if (inp.showPicker) { inp.showPicker(); return; } } catch (e) {}
    inp.focus(); inp.click();
  }

  function render() {
    let visible = todos.filter(t =>
      filter === "all" ? true :
      filter === "done" ? t.done :
      filter === "late" ? isLate(t) : !t.done
    );
    if (sortByDue) {
      visible = [...visible].sort((a, b) => {
        if (a.done !== b.done) return a.done ? 1 : -1;
        if (!a.due && !b.due) return 0;
        if (!a.due) return 1;
        if (!b.due) return -1;
        return a.due.localeCompare(b.due);
      });
    }

    list.innerHTML = "";
    for (const t of visible) {
      const li = document.createElement("li");
      if (t.done) li.classList.add("done");
      if (isLate(t)) li.classList.add("overdue");

      const cb = document.createElement("input");
      cb.type = "checkbox";
      cb.className = "check";
      cb.checked = t.done;
      cb.addEventListener("change", () => { t.done = cb.checked; save(); render(); });

      const span = document.createElement("span");
      span.className = "text";
      span.textContent = t.text;

      // Deadline-Chip (klickbar zum Ändern)
      const due = document.createElement("label");
      due.className = "due";
      const label = document.createElement("span");
      const picker = document.createElement("input");
      picker.type = "date";
      picker.value = t.due || "";
      picker.title = "Deadline ändern";
      picker.addEventListener("click", e => { e.preventDefault(); openPicker(picker); });
      picker.addEventListener("change", () => { t.due = picker.value || null; save(); render(); });

      if (t.due) {
        const diff = dayDiff(t.due);
        if (!t.done && diff < 0) due.classList.add("late");
        else if (!t.done && diff === 0) due.classList.add("today");
        label.textContent = "📅 " + formatDue(t.due);
        due.append(picker, label);
        const x = document.createElement("span");
        x.className = "x";
        x.textContent = "✕";
        x.title = "Deadline entfernen";
        x.addEventListener("click", e => { e.preventDefault(); e.stopPropagation(); t.due = null; save(); render(); });
        due.append(x);
      } else {
        due.classList.add("none");
        label.textContent = "📅 Keine Deadline";
        picker.title = "Deadline festlegen";
        due.append(picker, label);
      }

      const del = document.createElement("button");
      del.className = "del";
      del.title = "Löschen";
      del.textContent = "×";
      del.addEventListener("click", () => {
        todos = todos.filter(x => x.id !== t.id); save(); render();
      });

      li.append(cb, span, due, del);
      list.appendChild(li);
    }

    list.hidden = visible.length === 0;
    empty.hidden = visible.length !== 0;
    empty.textContent = todos.length === 0
      ? "Noch nichts zu tun – trag oben dein erstes Todo ein."
      : filter === "done" ? "Noch nichts erledigt."
      : filter === "late" ? "Nichts überfällig. 👍"
      : "Alles erledigt! 🎉";

    const open = todos.filter(t => !t.done).length;
    const late = todos.filter(isLate).length;
    count.textContent = todos.length === 0
      ? "Leere Liste"
      : `${open} offen · ${todos.length - open} erledigt` + (late ? ` · ${late} überfällig` : "");

    sortBtn.classList.toggle("active", sortByDue);
  }

  dateInput.addEventListener("input", () => dateInput.classList.toggle("empty", !dateInput.value));

  document.getElementById("form").addEventListener("submit", e => {
    e.preventDefault();
    const text = input.value.trim();
    if (!text) return;
    todos.unshift({ id: Date.now() + Math.random(), text, done: false, due: dateInput.value || null });
    input.value = "";
    dateInput.value = "";
    dateInput.classList.add("empty");
    input.focus();
    save(); render();
  });

  document.querySelectorAll("[data-filter]").forEach(btn => {
    btn.addEventListener("click", () => {
      filter = btn.dataset.filter;
      document.querySelectorAll("[data-filter]").forEach(b => b.classList.toggle("active", b === btn));
      render();
    });
  });

  sortBtn.addEventListener("click", () => {
    sortByDue = !sortByDue;
    try { localStorage.setItem(SORT_KEY, sortByDue ? "1" : "0"); } catch (e) {}
    render();
  });

  document.getElementById("clear").addEventListener("click", () => {
    todos = todos.filter(t => !t.done); save(); render();
  });

  // Um Mitternacht "Heute/Morgen/Überfällig" aktualisieren
  let lastDay = todayStr();
  setInterval(() => { if (todayStr() !== lastDay) { lastDay = todayStr(); render(); } }, 60000);

  // --- Backup ---
  document.getElementById("export").addEventListener("click", async () => {
    const json = JSON.stringify({ app: "todos", version: 1, exported: new Date().toISOString(), todos }, null, 2);
    const name = `todos-backup-${todayStr()}.json`;
    const file = new File([json], name, { type: "application/json" });
    // Auf dem iPhone: Teilen-Menü (in Dateien sichern, AirDrop, …)
    if (navigator.canShare && navigator.canShare({ files: [file] })) {
      try { await navigator.share({ files: [file], title: "Todo-Backup" }); return; }
      catch (e) { if (e.name === "AbortError") return; }
    }
    const url = URL.createObjectURL(file);
    const a = document.createElement("a");
    a.href = url; a.download = name;
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(() => URL.revokeObjectURL(url), 1000);
  });

  const importFile = document.getElementById("importFile");
  document.getElementById("import").addEventListener("click", () => importFile.click());
  importFile.addEventListener("change", async () => {
    const f = importFile.files[0];
    importFile.value = "";
    if (!f) return;
    try {
      const data = JSON.parse(await f.text());
      const incoming = Array.isArray(data) ? data : data.todos;
      if (!Array.isArray(incoming)) throw new Error();
      const ids = new Set(todos.map(t => t.id));
      const fresh = incoming
        .filter(t => t && typeof t.text === "string" && !ids.has(t.id))
        .map(t => ({ id: t.id ?? Date.now() + Math.random(), text: t.text, done: !!t.done, due: t.due || null }));
      todos = [...todos, ...fresh];
      save(); render();
      alert(fresh.length ? `${fresh.length} Todo(s) importiert.` : "Alles schon vorhanden – nichts Neues importiert.");
    } catch (e) {
      alert("Diese Datei konnte nicht gelesen werden. Ist es ein Todo-Backup?");
    }
  });

  // --- Hell / Auto / Dunkel ---
  const themeMetas = document.querySelectorAll('meta[name="theme-color"]');
  function applyTheme(mode) {
    document.documentElement.dataset.theme = mode;
    // Statusleiste/Browserleiste passend einfärben
    themeMetas.forEach(m => m.setAttribute("content", mode === "dark" ? "#1b1a18" : "#f4f1ea"));
    document.querySelectorAll("[data-theme-btn]").forEach(b => {
      const on = b.dataset.themeBtn === mode;
      b.classList.toggle("active", on);
      b.setAttribute("aria-checked", on);
    });
  }
  // Wellenförmige Kante, die beim Herunterlaufen hin- und herschwappt
  function waveFrames(steps = 70, points = 72) {
    const ease = t => t < 0.5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2;
    const frames = [];
    for (let f = 0; f <= steps; f++) {
      const t = f / steps;
      const amp = 1 + 4 * Math.sin(Math.PI * t);       // Welle ist in der Mitte am stärksten
      const base = -10 + ease(t) * 120;                   // von oberhalb bis unterhalb des Bildschirms
      const phase = t * Math.PI * 4;                      // Welle läuft seitwärts mit
      const pts = ["0% 0%", "100% 0%"];
      for (let i = points; i >= 0; i--) {
        const x = (i / points) * 100;
        const y = base
          + amp * Math.sin((x / 100) * Math.PI * 2.4 + phase)
          + amp * 0.3 * Math.sin((x / 100) * Math.PI * 4.2 - phase * 1.4);
        pts.push(`${x.toFixed(2)}% ${y.toFixed(2)}%`);
      }
      frames.push(`polygon(${pts.join(", ")})`);
    }
    return frames;
  }
  let themeMode = document.documentElement.dataset.theme === "dark" ? "dark" : "light";
  applyTheme(themeMode);
  document.querySelectorAll("[data-theme-btn]").forEach(b => {
    b.setAttribute("role", "radio");
    b.addEventListener("click", () => {
      if (b.dataset.themeBtn === themeMode) return;
      themeMode = b.dataset.themeBtn;
      try { localStorage.setItem("todos-theme", themeMode); } catch (e) {}
      const reduce = window.matchMedia("(prefers-reduced-motion: reduce)").matches;
      if (!document.startViewTransition || reduce) { applyTheme(themeMode); return; }
      const t = document.startViewTransition(() => applyTheme(themeMode));
      t.ready.then(() => {
        document.documentElement.animate(
          { clipPath: waveFrames() },
          { duration: 1300, easing: "linear", pseudoElement: "::view-transition-new(root)" }
        );
      }).catch(() => {});
    });
  });

  // Wenn die App aus dem Hintergrund zurückkommt: Datumsanzeige aktualisieren
  document.addEventListener("visibilitychange", () => { if (!document.hidden) render(); });

  // Offline-Unterstützung
  if ("serviceWorker" in navigator && location.protocol.startsWith("http")) {
    navigator.serviceWorker.register("sw.js").catch(() => {});
  }

  render();
</script>
</body>
</html>
